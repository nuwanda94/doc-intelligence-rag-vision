name: Smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check app.py
        run: python -m py_compile app.py

      - name: Parse app.py and list top-level imports
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("app.py").read_text(encoding="utf-8")
          tree = ast.parse(source, filename="app.py")

          imports = []
          for node in tree.body:
              if isinstance(node, ast.Import):
                  imports.extend(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  module = node.module or ""
                  names = ", ".join(alias.name for alias in node.names)
                  imports.append(f"{module} ({names})" if names else module)

          print("app.py parsed successfully.")
          print("Top-level imports:")
          for name in imports:
              print(f"  - {name}")
          if not imports:
              raise SystemExit("No top-level imports found in app.py")
          PY

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner only
        run: pip install pytest

      - name: Run CPU-only helper tests
        run: pytest -q tests
